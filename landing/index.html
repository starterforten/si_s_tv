<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    text-align: center;
    max-width: 900px;
    width: 90%;
}

img {
    max-width: 100%;
    height: auto;
}

h1 {
    margin-top: 25px;
    font-weight: normal;
}

p {
    font-size: 18px;
    line-height: 1.5;
}

button {
    margin-top: 30px;
    padding: 15px 40px;
    font-size: 20px;
    border: none;
    border-radius: 8px;
    background: #1976d2;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #125aa3;
}
</style>
</head>

<body>

<div class="container">

    <!-- Banner -->
    <img src="../images/banner.png" alt="Banner">

    <h1>Welcome</h1>

    <p>
        Thank you for joining. When ready, click below to connect your camera and microphone.
    </p>

    <button onclick="join()">Join Studio</button>

</div>

<script>
function join() {
    window.location.href = "../";
}
</script>

</body>
</html>
